name = "covercraft-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Set your GitHub Pages URL here so the Worker allows requests from it.
# Replace with your actual deployed URL after publishing to GitHub Pages.
[vars]
ALLOWED_ORIGIN = "https://adelinelin9.github.io"
OPENAI_MODEL = "gpt-6-luna"

# OPENAI_API_KEY is stored as a secret — never put it here.
# Run from the repository root: npm run secret:worker
